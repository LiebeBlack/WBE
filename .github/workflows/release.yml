name: Release S.M.A.C Web Core

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # crear releases y subir el zip

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Ninja
        run: choco install ninja -y --no-progress

      - name: Preparar MSVC (enlaces del SDK para clang-cl)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configurar (clang-cl + Ninja, MinSizeRel)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DSMAC_LTO=ON
          -DSMAC_MIMALLOC=ON

      - name: Compilar
        run: cmake --build build --parallel

      - name: Descargar uBlock Origin (release oficial, build Chromium)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/gorhill/uBlock/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match "uBlock0_\d+\.\d+\.\d+\.chromium\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "No se encontró el asset chromium de uBlock" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ubo.zip
          Expand-Archive -Path ubo.zip -DestinationPath ubo_tmp
          # El zip trae una carpeta raíz uBlock0_<ver>; la normalizamos a extensions/uBlock
          $root = (Get-ChildItem ubo_tmp -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path dist/extensions | Out-Null
          Copy-Item -Recurse -Force $root dist/extensions/uBlock
          Get-ChildItem dist/extensions/uBlock | Select-Object -First 5

      - name: Empaquetar (exe + extensión + README)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/SMAC-WebCore.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath SMAC-WebCore-win64.zip -Force
          Get-Item SMAC-WebCore-win64.zip | Select-Object Name, Length

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SMAC-WebCore-win64.zip
          generate_release_notes: true
          body: |
            **S.M.A.C Web Core** — navegador ultra-minimalista para hardware de bajos recursos.

            * Incluye **uBlock Origin** preinstalado (carpeta `extensions/uBlock`).
            * Requiere **WebView2 Runtime (Evergreen)** — ya viene con Windows 11.
            * Configuración: `%LOCALAPPDATA%\SMAC\WebCore\smac.ini`.
